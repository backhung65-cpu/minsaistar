# skills/ 폴더나 site.json이 바뀌면 skills-data.js를 다시 만들어 커밋합니다.
# (GitHub Pages는 빌드 없이 저장소 파일을 그대로 보여 주기 때문에 필요합니다.)
name: 스킬 목록 갱신
on:
  push:
    branches: [main]
    paths: ["skills/**", "site.json", "build.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- skills-data.js; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-data.js
          git commit -m "스킬 목록 자동 갱신"
          git push
