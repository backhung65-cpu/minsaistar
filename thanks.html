<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결제 완료 — MIRACLE SKILLS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .done { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding-block: 48px; }
  .done-card { width: min(440px, 100%); display: grid; gap: 14px; justify-items: center; }
  .done-card img { width: 160px; border-radius: 16px; aspect-ratio: 4 / 5; object-fit: cover; }
  .done-card h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.25; }
  .done-card .sub { color: var(--sub); }
  .done-card .btn { margin-top: 8px; }
  .done-card .muted { font-size: 14px; }
</style>
</head>
<body>
<main class="done wrap">
  <div class="done-card">
    <img id="t-img" alt="" hidden>
    <p class="eyebrow">결제 완료</p>
    <h1>결제가 완료되었습니다.<br>감사합니다.</h1>
    <p class="sub" id="t-title">네이버 카페에서 스킬을 받아 가세요.</p>
    <a class="btn wide" id="t-go" href="#">네이버 카페로 이동 →</a>
    <p class="muted" id="t-count"></p>
    <a class="muted" href="./">갤러리로 돌아가기</a>
  </div>
</main>
<script src="skills-data.js"></script>
<script>
(function () {
  var SITE = window.SITE || {}, SKILLS = window.SKILLS || [];
  var id = new URLSearchParams(location.search).get("skill") || (location.hash.match(/skill-([^&]+)/) || [])[1];
  var s = SKILLS.filter(function (x) { return x.id === id; })[0];
  var url = (s && s.cafe) || SITE.cafeUrl;
  var go = document.getElementById("t-go");
  if (url) go.href = url; else go.setAttribute("aria-disabled", "true");
  if (s) {
    document.getElementById("t-title").textContent = "「" + s.title + "」 스킬은 네이버 카페에서 받을 수 있습니다.";
    var img = document.getElementById("t-img"); img.src = s.image; img.alt = s.title; img.hidden = false;
  }
  if (!url) return;
  var n = 5, c = document.getElementById("t-count");
  (function tick() {
    c.textContent = n + "초 뒤 카페로 이동합니다.";
    if (n-- <= 0) { location.href = url; return; }
    setTimeout(tick, 1000);
  })();
})();
</script>
</body>
</html>
